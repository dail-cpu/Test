<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - {{ platform_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="landing-nav">
        <a href="{{ url_for('landing') }}" class="nav-brand">{{ platform_name }}</a>
        <div class="nav-links"></div>
    </nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages" style="max-width:500px;margin:1rem auto">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    <div class="login-container">
        <div class="login-card">
            <h1>Create Your POS</h1>
            <p class="login-subtitle">Set up your business in 30 seconds</p>
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="business_name">Business Name</label>
                    <input type="text" id="business_name" name="business_name" value="{{ form.get('business_name', '') }}" required placeholder="Joe's Coffee">
                </div>
                <div class="form-group">
                    <label for="slug">Your URL</label>
                    <div class="slug-preview">
                        <input type="text" id="slug" name="slug" value="{{ form.get('slug', '') }}" required placeholder="joes-coffee" pattern="[a-z0-9][a-z0-9-]{1,30}[a-z0-9]">
                        <small class="slug-hint" id="slug-hint"></small>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password (min 6 chars)</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create My POS</button>
            </form>
        </div>
    </div>
    <script>
    const nameInput = document.getElementById("business_name");
    const slugInput = document.getElementById("slug");
    const hint = document.getElementById("slug-hint");
    let userEditedSlug = slugInput.value !== "";

    slugInput.addEventListener("input", () => { userEditedSlug = true; updateHint(); });
    nameInput.addEventListener("input", () => {
        if (!userEditedSlug) {
            slugInput.value = nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);
        }
        updateHint();
    });
    function updateHint() {
        if (slugInput.value) {
            hint.textContent = window.location.origin + "/" + slugInput.value + "/";
        } else {
            hint.textContent = "";
        }
    }
    updateHint();
    </script>
</body>
</html>
